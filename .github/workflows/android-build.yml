name: Android Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract project
        run: |
          if [ -f Advanced-Notes.zip ]; then
            rm -rf _project && mkdir _project
            unzip -q Advanced-Notes.zip -d _project
            SETTINGS=$(find _project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          elif [ -f settings.gradle.kts ]; then
            SETTINGS=./settings.gradle.kts
          fi
          if [ -z "${SETTINGS:-}" ]; then
            echo "::error::Advanced-Notes.zip was not found in the top level of the repository (and no settings.gradle.kts either). Upload Advanced-Notes.zip to the repository root and run again."
            exit 1
          fi
          echo "PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.8.2 (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: Install Android SDK platform (best effort)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" || sdkmanager "platforms;android-37" "build-tools;36.0.0" || echo "sdkmanager could not preinstall; Gradle will try to download what it needs."

      - name: Make sure the Gradle wrapper exists
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Wrapper files missing - generating them with Gradle 9.8.2"
            gradle wrapper --gradle-version 9.8.2
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        run: |
          cd "$PROJECT_DIR"
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: advanced-notes-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: advanced-notes-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Advanced Notes build"
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "- Signed release APK: built (see artifact advanced-notes-release-apk)."
            else
              echo "- Signed release APK: **skipped** - the KEYSTORE_BASE64 secret is not set. The debug APK is still built."
            fi
            echo "- Debug APK artifact: advanced-notes-debug-apk"
          } >> "$GITHUB_STEP_SUMMARY"
